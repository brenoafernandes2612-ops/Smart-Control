<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabeca">
    <img src="assets/images/logo_halter.png" alt="ícone do perfil do usuario" height="80" width="80" class="logo">
    </header>

    <main class="main">

            <form action="post" class="form">

                <h1>Smart control</h1>

                <img src="assets/images/img.perfil.png" alt="imagem perfil" height="90" width="90" class="perfil">

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu Email...">

                <label for="password" class="label">Senha:</label>
                <input type="password" name="password" id="password" placeholder="Digite sua senha...">

                <a href="AlterarSenha.html" class="senha">Esqueceu a senha?</a>

                <a href="dashboard.html">
                    <button type="button" class="login">Login</button>
                </a>

                <a href="cadastro.html">
                <button type="button" class="registrar">Registrar</button>
                </a>

            </form>

    </main>

    <footer class="footer">

    <a href="https://pedrotech.com.br/pedrolandia/" target="_blank">Portal Pedro Landia</a>

    </footer>

</body>
</html>
