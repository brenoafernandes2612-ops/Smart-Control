<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>

<body>

    <header class="cabeca">
        <h1 class="titulo">Smart control</h1>

        <img src="assets/images/logo_halter.png" alt="ícone do perfil do usuario" height="100" width="100" class="logo">
    </header>

    <main class="main">

        <form action="index.html" method="get" class="formulario">
            <h2 class="titulo_form">Registrar</h2>

            <label for="text" class="label">Nome completo:</label>
            <input class="input" type="text" name="text" id="text" placeholder="Digite seu nome completo..." required>

            <label for="email" class="label">Email:</label>
            <input class="input" type="email" name="email" id="email" placeholder="Digite seu Email..." required>

            <label for="senha" class="label">Senha:</label>
            <input class="input" type="password" name="senha" id="senha" placeholder="Digite sua senha..." required
                minlength="8">

            <label for="nivel_acesso" class="label">Nível de acesso:</label>
            <select name="nivel_acesso" id="nivel_acesso" class="input">
                <option value="administrador">Administrador</option>
                <option value="professor">Professor</option>
                <option value="aluno">Aluno</option>
                <option value="recepcao">Recepção</option>
            </select>

            <div class="checkbox">

                <label for="Termos_uso" class="label">Aceite termos de uso</label>
                <input class="checkbox-input" type="checkbox" name="Termos_uso" id="Termos_uso" required>

            </div>

            <button type="submit" class="botao">Registrar</button>

        </form>

    </main>

    <footer class="footer">

        <a href="https://pedrotech.com.br/pedrolandia/" target="_blank">Portal Pedro Landia</a>
        <iframe class="mapa"
            src="https://www.google.com/maps/embed?pb=!3m2!1spt-BR!2sbr!4v1786045091116!5m2!1spt-BR!2sbr!6m8!1m7!1sGPkj2i1MSa_HGa0GVXRiyw!2m2!1d-21.76029492397011!2d-43.33576496128647!3f124.29156697912771!4f12.41518984439331!5f0.7820865974627469"
            width="350" height="250" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </footer>

</body>

</html>
