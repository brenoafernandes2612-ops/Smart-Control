<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <nav class="cabecalho">
        <h1>Smart Control</h1>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-navegacao" aria-label="Abrir menu">
            <img src="assets/images/icone_menu.png" alt="">
        </button>
        <p id="nomeCompleto"></p>
        <p id="dataAtual"></p>
        <img src="assets/images/logo_halter.png" alt="Ícone do perfil do usuário" height="100" width="100" class="logo">
    </nav>

    <aside class="barra_nav" id="menu-navegacao">
        <ul>
            <li><a href="">Início</a></li>
            <li><a href="">Perfil</a></li>
            <li><a href="">Relatórios</a></li>
            <li><a href="">Configurações</a></li>
            <li><a href="">Fichas</a></li>
        </ul>
    </aside>

    <main>

        <section id="boas-vindas"></section>
        
        <div class="dashboard">

            <div class="campoBusca">
                <label for="campoBusca">Pesquisar:</label>
                <input type="text" id="campoBusca" placeholder="Buscar...">
            </div>
            
                <div class="relatorio_card">
                    <h1>Relatório de acessos recentes</h1>
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Data</th>
                                <th>Hora</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Pedro</td>
                                <td>09/08/2026</td>
                                <td>09:20</td>
                                <td>Falha</td>
                            </tr>
                            <tr>
                                <td>Lucas</td>
                                <td>04/08/2026</td>
                                <td>09:30</td>
                                <td>Sucesso</td>
                            </tr>
                            <tr>
                                <td>Hugo</td>
                                <td>04/08/2026</td>
                                <td>09:00</td>
                                <td>Sucesso</td>
                            </tr>
                            <tr>
                                <td>Davi</td>
                                <td>04/08/2026</td>
                                <td>08:45</td>
                                <td>Falha</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
        </div>
    </main>

    <footer>

        <a href="https://pedrotech.com.br/pedrolandia/" target="_blank">Portal Pedro Landia</a>
    
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
