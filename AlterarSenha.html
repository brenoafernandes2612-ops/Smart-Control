<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha?</title>
</head>
<body>
    <header>
        <img src="assets/images/logo_halter.png" alt="ícone do perfil do usuario" height="100" width="100">
    </header>
    <main>
        <form method="post">
            <h1>Alterar Senha</h1>
            
            <label for="Alterar senha">Alterar senha:</label>
            <input type="password" name="Alterar senha" id="alterar-senha" placeholder="Digite sua nova senha..." required>
            <br><br>
            <label for="Confirmar senha">Confirmar senha:</label>
            <input type="password" name="Confirmar senha" id="confirmar-senha" placeholder="Confirme sua nova senha..." required>

            <br>
            <a href="PaginaInicial.html">Mudar senha</a>
            <br><br>

        </form>
    </main>
    <footer>

        <a href="https://pedrotech.com.br/pedrolandia/" target="_blank">Portal Pedro Landia</a>
    
    </footer>
</body>
</html>
